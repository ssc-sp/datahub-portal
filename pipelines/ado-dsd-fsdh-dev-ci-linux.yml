trigger:
  branches:
    include:
      - develop
      - proof-of-concept
  paths:
    include:
      - "Portal/**"
      - "ServerlessOperations/**"
      - "ResourceProvisioner/**"
      - "Directory.Packages.props"

pr:
  autoCancel: true
  branches:
    include:
      - develop
      - proof-of-concept
  paths:
    include:
      - "Portal/**"
      - "ServerlessOperations/**"
      - "ResourceProvisioner/**"
      - "Directory.Packages.props"

resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/develop

jobs:
  - job: Build_Test
    displayName: Build and Test

    pool:
      name: GcDc-CTO-ENT-FSDH-Core-EW-ag

    steps:
      - checkout: self
        clean: true
        fetchTags: false
        persistCredentials: true

      - task: UseDotNet@2
        displayName: Use .NET Core SDK 10.0.x
        inputs:
          version: 10.0.x
          includePreviewVersions: true
          performMultiLevelLookup: true

      - task: UseNode@1
        displayName: Use Node 16.x
        inputs:
          version: 16.x

      - task: UsePythonVersion@0
        displayName: Use Python 3.11
        inputs:
          versionSpec: 3.11

      - task: PowerShell@2
        displayName: Init version vars + set build number from version.txt
        inputs:
          targetType: inline
          script: |
            $versionFile = Join-Path "$(Build.SourcesDirectory)" "version.txt"

            if (-not (Test-Path $versionFile)) {
              Write-Error "version.txt not found at $versionFile"
              exit 1
            }

            $version = (Get-Content -Path $versionFile -Raw).Trim()

            if ([string]::IsNullOrWhiteSpace($version)) {
              Write-Error "version.txt is empty."
              exit 1
            }

            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "version.txt does not contain a valid semantic version (major.minor.patch). Found: '$version'"
              exit 1
            }

            $parts = $version.Split('.')
            $majorMinor = "$($parts[0]).$($parts[1])"
            $revision = $parts[2]
            $dateCode = Get-Date -Format 'yyyyMMdd_HHmmssfff'

            Write-Host "##vso[task.setvariable variable=version.MajorMinor]$majorMinor"
            Write-Host "##vso[task.setvariable variable=version.Revision]$revision"
            Write-Host "##vso[task.setvariable variable=version.Build]$dateCode"

            $buildName = "v${version}-${dateCode}"

            Write-Host "Setting the name of the build to '$buildName'."
            Write-Host "##vso[build.updatebuildnumber]$buildName"

      - task: PowerShell@2
        displayName: Prepare Portal appsettings
        inputs:
          targetType: inline
          script: |
            cd Portal/src

            $files = Get-ChildItem `
              -Path Datahub.Portal `
              -Include appsettings*json-tmpl,launch*json-tmpl `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notlike "*\Debug\*"
              }

            foreach ($file in $files) {
              $fileRendered = $file.FullName.Trim("-tmpl")
              Write-Host "Processing file: ${file} > $fileRendered"

              Copy-Item `
                $file.FullName `
                -Force `
                -Destination $fileRendered
            }

            cd Datahub.Portal

            mv appsettings.Development.json appsettings.dev.json

            Move-Item `
              -Force `
              appsettings.json-tmpl-spdatahub `
              appsettings.json

      - task: DotNetCoreCLI@2
        displayName: Build Portal
        inputs:
          projects: Portal/src/Datahub.Portal/*.csproj
          arguments: --configuration $(BuildConfiguration)

      - task: DotNetCoreCLI@2
        displayName: Publish Portal
        inputs:
          command: publish
          publishWebProjects: false
          projects: Portal/src/Datahub.Portal/*.csproj
          arguments: >-
            -o $(Build.ArtifactStagingDirectory)/output/portal
            -r "linux-x64"
            --self-contained true

      - task: PublishBuildArtifacts@1
        displayName: "Publish Artifact: datahub-portal"
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/output/portal
          ArtifactName: datahub-portal

      - task: DotNetCoreCLI@2
        displayName: Restore Serverless Functions
        inputs:
          command: restore
          projects: ServerlessOperations/src/Datahub.Functions/*.csproj

      - task: DotNetCoreCLI@2
        displayName: Build Serverless Functions
        inputs:
          projects: ServerlessOperations/src/Datahub.Functions/Datahub.Functions.csproj
          arguments: --configuration $(BuildConfiguration)

      - task: DotNetCoreCLI@2
        displayName: Publish Serverless Functions
        inputs:
          command: publish
          publishWebProjects: false
          projects: ServerlessOperations/src/Datahub.Functions/Datahub.Functions.csproj
          arguments: >-
            -o $(Build.ArtifactStagingDirectory)/output/serverless
            -r "linux-x64"
            --self-contained true

      - task: PublishBuildArtifacts@1
        displayName: "Publish Artifact: datahub-function"
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/output/serverless
          ArtifactName: datahub-function

      - task: DotNetCoreCLI@2
        displayName: Restore Resource Provisioner
        inputs:
          command: restore
          projects: ResourceProvisioner/src/ResourceProvisioner.Functions/*.csproj

      - task: DotNetCoreCLI@2
        displayName: Build Resource Provisioner
        inputs:
          projects: ResourceProvisioner/src/ResourceProvisioner.Functions/*.csproj
          arguments: --configuration $(BuildConfiguration)

      - task: DotNetCoreCLI@2
        displayName: Publish Resource Provisioner
        inputs:
          command: publish
          publishWebProjects: false
          projects: ResourceProvisioner/src/ResourceProvisioner.Functions/*.csproj
          arguments: >-
            -o $(Build.ArtifactStagingDirectory)/output/resourceprovisioner
            -r "linux-x64"
            --self-contained true

      - task: PublishBuildArtifacts@1
        displayName: "Publish Artifact: resource-provisioner-function"
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/output/resourceprovisioner
          ArtifactName: resource-provisioner-function

      - task: DotNetCoreCLI@2
        displayName: Restore Maintenance Page
        inputs:
          command: restore
          projects: Portal/src/Datahub.Maintenance/*.csproj

      - task: DotNetCoreCLI@2
        displayName: Build Maintenance Page
        inputs:
          projects: Portal/src/Datahub.Maintenance/*.csproj
          arguments: --configuration $(BuildConfiguration)

      - task: DotNetCoreCLI@2
        displayName: Publish Maintenance Page
        inputs:
          command: publish
          publishWebProjects: false
          projects: Portal/src/Datahub.Maintenance/*.csproj
          arguments: >-
            -o $(Build.ArtifactStagingDirectory)/output/maintenancepage
            -r "linux-x64"
            --self-contained true

      - task: PublishBuildArtifacts@1
        displayName: "Publish Artifact: maintenance page"
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/output/maintenancepage
          ArtifactName: maintenance-page

      - task: Bash@3
        displayName: Install Python User Provisioner dependencies
        inputs:
          targetType: inline
          script: |
            echo "Building Python User Provisioner"
            pip install -r ./requirements.txt
          workingDirectory: ResourceProvisioner/src/ResourceProvisioner_PyFunctions

      - task: PublishBuildArtifacts@1
        displayName: "Publish Artifact: user provisioner"
        inputs:
          PathtoPublish: ResourceProvisioner/src/ResourceProvisioner_PyFunctions
          ArtifactName: user-provisioner

      - template: fsdh-portal-tests.yml

      - template: fsdh-resource-provisioner-tests.yml