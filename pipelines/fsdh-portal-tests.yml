jobs:
- job: ConfigureSettings
  displayName: 'Configure environment settings'
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 10.0.x'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      performMultiLevelLookup: true

  - task: AzurePowerShell@5
    displayName: 'Run gen-all-settings.ps1 to configure environment variables'
    inputs:
      azureSubscription: 'fsdh-az-service-connection'
      ScriptType: 'FilePath'
      ScriptPath: './gen-all-settings.ps1'
      ScriptArguments: '-Environment dev'
      azurePowerShellVersion: 'LatestVersion'

- job: DatahubFunctionUnitTests
  displayName: 'Datahub Function Unit Tests'
  dependsOn: ConfigureSettings
  condition: succeeded()
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 10.0.x'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      performMultiLevelLookup: true

  - task: DotNetCoreCLI@2
    displayName: 'Datahub Function Unit Tests'
    inputs:
      command: 'test'
      projects: 'ServerlessOperations/test/Datahub.Functions.UnitTests/Datahub.Functions.UnitTests.csproj'
      testRunTitle: 'Datahub Function Unit Tests'
      arguments: '--configuration $(buildConfiguration) --coverlet --coverlet-output-format cobertura'

- job: DatahubInfrastructureUnitTests
  displayName: 'Datahub Infrastructure Unit Tests'
  dependsOn: ConfigureSettings
  condition: succeeded()
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 10.0.x'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      performMultiLevelLookup: true

  - task: DotNetCoreCLI@2
    displayName: 'Datahub Infrastructure Unit Tests'
    inputs:
      command: 'test'
      projects: 'Portal/test/Datahub.Infrastructure.UnitTests/Datahub.Infrastructure.UnitTests.csproj'
      testRunTitle: 'Datahub Infrastructure Unit Tests'
      arguments: '--configuration $(buildConfiguration) --coverlet --coverlet-output-format cobertura'

- job: DatahubSpecflowTests
  displayName: 'Datahub Specflow Tests'
  dependsOn: ConfigureSettings
  condition: succeeded()
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 10.0.x'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      performMultiLevelLookup: true

  - task: DotNetCoreCLI@2
    displayName: 'Datahub Specflow Tests'
    inputs:
      command: 'test'
      projects: 'Portal/test/Datahub.SpecflowTests/Datahub.SpecflowTests.csproj'
      testRunTitle: 'Datahub Specflow Tests'
      arguments: '--configuration $(buildConfiguration) --coverlet --coverlet-output-format cobertura'

- job: DatahubUnitTests
  displayName: 'Datahub Unit Tests'
  dependsOn: ConfigureSettings
  condition: succeeded()
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 10.0.x'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      performMultiLevelLookup: true

  - task: DotNetCoreCLI@2
    displayName: 'Datahub Unit Tests'
    inputs:
      command: 'test'
      projects: 'Portal/test/Datahub.Tests/Datahub.Tests.csproj'
      testRunTitle: 'Datahub Unit Tests'
      arguments: '--configuration $(buildConfiguration) --coverlet --coverlet-output-format cobertura'

- job: CoverageReport
  displayName: 'Create code coverage report'
  dependsOn:
  - DatahubFunctionUnitTests
  - DatahubInfrastructureUnitTests
  - DatahubSpecflowTests
  - DatahubUnitTests
  condition: succeededOrFailed()
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 10.0.x'
    inputs:
      version: 10.0.x
      includePreviewVersions: true
      performMultiLevelLookup: true

  - script: |
      dotnet tool install -g dotnet-reportgenerator-globaltool
      reportgenerator -reports:$(Agent.WorkFolder)/**/coverage.cobertura.xml -targetdir:$(Build.SourcesDirectory)/Portal/test/CodeCoverage -reporttypes:'HtmlInline_AzurePipelines;Cobertura'
      echo "##vso[task.setvariable variable=disable.coverage.autogenerate;]true"
    displayName: Create code coverage report

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage report'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '$(Build.SourcesDirectory)/Portal/test/CodeCoverage/Cobertura.xml'
      reportDirectory: '$(Build.SourcesDirectory)/Portal/test/CodeCoverage'
