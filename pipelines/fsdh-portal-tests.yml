parameters:
  - name: dependsOn
    type: string
    default: ''

jobs:
  - job: Portal_Testing_Matrix
    displayName: 'Agent job - Portal Testing'
    dependsOn: ${{ parameters.dependsOn }}
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        Datahub_Functions_UnitTests:
          testProject: 'ServerlessOperations/test/Datahub.Functions.UnitTests/Datahub.Functions.UnitTests.csproj'
          testRunTitle: 'Datahub Function Unit Tests'
        Datahub_Infrastructure_UnitTests:
          testProject: 'Portal/test/Datahub.Infrastructure.UnitTests/Datahub.Infrastructure.UnitTests.csproj'
          testRunTitle: 'Datahub Infrastructure Unit Tests'
        Datahub_Specflow_Tests:
          testProject: 'Portal/test/Datahub.SpecflowTests/Datahub.SpecflowTests.csproj'
          testRunTitle: 'Datahub Specflow Tests'
        Datahub_Unit_Tests:
          testProject: 'Portal/test/Datahub.Tests/Datahub.Tests.csproj'
          testRunTitle: 'Datahub Unit Tests'
    steps:
      - checkout: self
        clean: true
        lfs: true
        fetchTags: false

      - task: UseDotNet@2
        displayName: 'Use .NET Core sdk 10.0.x'
        inputs:
          version: 10.0.x
          includePreviewVersions: true
          performMultiLevelLookup: true

      - task: AzurePowerShell@5
        displayName: 'Run gen-all-settings.ps1 to configure environment variables'
        inputs:
          azureSubscription: 'fsdh-az-service-connection'
          ScriptType: 'FilePath'
          ScriptPath: './gen-all-settings.ps1'
          ScriptArguments: '-Environment dev'
          azurePowerShellVersion: 'LatestVersion'

      - task: DotNetCoreCLI@2
        displayName: 'Restore $(testRunTitle) dependencies'
        inputs:
          command: 'restore'
          projects: '$(testProject)'
          arguments: '--disable-parallel'

      - script: |
          mkdir -p "$(Agent.TempDirectory)/coverage/$(System.JobName)"
        displayName: 'Create coverage output folder for $(testRunTitle)'

      - task: DotNetCoreCLI@2
        displayName: '$(testRunTitle)'
        condition: succeededOrFailed()
        inputs:
          command: 'test'
          projects: '$(testProject)'
          testRunTitle: '$(testRunTitle)'
          arguments: >
            --configuration $(BuildConfiguration)
            --logger "trx;LogFileName=$(System.JobName).trx"
            --coverage --coverage-output-format cobertura --coverage-output "$(Agent.TempDirectory)/coverage/$(System.JobName)/coverage.cobertura.xml"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish coverage results for $(testRunTitle)'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(Agent.TempDirectory)/coverage/$(System.JobName)'
          artifact: 'coverage-$(System.JobName)'

  - job: Portal_Testing_Coverage
    displayName: 'Agent job - Portal Testing Coverage'
    dependsOn: Portal_Testing_Matrix
    condition: always()
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        clean: true
        lfs: true
        fetchTags: false

      - task: UseDotNet@2
        displayName: 'Use .NET Core sdk 10.0.x'
        inputs:
          version: 10.0.x

      - task: DownloadPipelineArtifact@2
        displayName: 'Download coverage results'
        inputs:
          buildType: 'current'
          itemPattern: 'coverage-*/**'
          targetPath: '$(Pipeline.Workspace)/coverage'

      - script: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:$(Pipeline.Workspace)/coverage/**/coverage.cobertura.xml -targetdir:$(Build.SourcesDirectory)/Portal/test/CodeCoverage -reporttypes:'HtmlInline_AzurePipelines;Cobertura'
          echo "##vso[task.setvariable variable=disable.coverage.autogenerate;]true"
        displayName: 'Create code coverage report'

      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage report'
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Build.SourcesDirectory)/Portal/test/CodeCoverage/Cobertura.xml'
          reportDirectory: '$(Build.SourcesDirectory)/Portal/test/CodeCoverage'
