---
name: Pull request auto update

on:
  push:
    branches:
      - "develop"
jobs:
  refresh_stale_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Create App token
        id: create_token
        uses: ssc-sp/.github/.github/actions/create-app-token@main
        with:
          app-id: ${{ vars.DATAHUB_PORTAL_PR_APP_ID }}
          private-key: ${{ secrets.DATAHUB_PORTAL_PR_RW }}

      - name: Automatically update PR
        uses: KingBain/update-pr-branch@master
        with:
          token: ${{ steps.create_token.outputs.token }}
          base: "develop"
          excluded_labels: "dont-auto-refresh"
          required_approval_count: 0
          require_passed_checks: false
          require_auto_merge_enabled: false
          sort: "created"
          direction: "desc"
