---
name: PR Refresh

on:
  push:
    branches:
      - "develop"

permissions: {}

concurrency:
  group: pr-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh_stale_prs:
    runs-on: ubuntu-latest
    environment: datahub-portal-pr-refresh

    steps:
      - name: Create App token
        id: create_token
        uses: ssc-sp/.github/.github/actions/create-app-token@a912acb05649c75f3f811b59044200a09de10b83 # main
        with:
          app-id: ${{ vars.DATAHUB_PORTAL_PR_APP_ID }}
          private-key: ${{ secrets.DATAHUB_PORTAL_PR_RW }}

      - name: Automatically update PR
        uses: KingBain/update-pr-branch@6c54f8bd85ea9082994e08a756df1d7677ad03f2 # master-update
        with:
          token: ${{ steps.create_token.outputs.token }}
          base: "develop"
          excluded_labels: "dont-auto-refresh"
          required_approval_count: 0
          require_passed_checks: false
          require_auto_merge_enabled: false
          sort: "created"
          direction: "desc"