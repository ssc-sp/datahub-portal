name: Docker Image CI

on:
  push:
    branches: [ "develop", "proof-of-concept", "release" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        cd ResourceProvisioner\src\ResourceProvisioner_PyFunctions
        docker build . --file Dockerfile --tag fsdh-py:latest       
