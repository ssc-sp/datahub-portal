---
name: 1. Create Release

on:
  push:
    branches:
      - develop

permissions: {}

concurrency:
  group: release-manager-create-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-release-process:
    environment: datahub-portal-releases
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DH_RELEASE_MANAGER_ID }}
          private-key: ${{ secrets.DH_RELEASE_MANAGER_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Trigger Release Process
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: develop
          release-type: simple
          config-file: .release-please-config.json
          token: ${{ steps.create_token.outputs.token }}
