name: Build & Publish Portal (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERFILE: Dockerfiles/Dockerfile.portal
  CONTEXT: .
  PLATFORMS: linux/amd64
  IMAGE_GHCR: ghcr.io/${{ github.repository }}/datahub-portal
  PUSH_TO_JFROG: "false"
  IMAGE_JFROG: artifacts-artefacts.devops.cloud-nuage.canada.ca/docker-local/datahub-portal

concurrency:
  group: portal-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JFrog CLI (OIDC)
        uses: jfrog/setup-jfrog-cli@v4
        with:
          jfrog-url: https://artifacts-artefacts.devops.cloud-nuage.canada.ca
          oidc-provider-name: github-oidc
          audience: github-actions
          disable-jfrog-cli-analytics: true

      - name: Docker login to Artifactory (for pulling base images)
        run: jf rt docker-login artifacts-artefacts.devops.cloud-nuage.canada.ca

      - name: Read version.txt
        id: ver
        run: |
          if [ ! -f version.txt ]; then
            echo "version.txt not found"; exit 1
          fi
          v=$(sed -e 's/"//g' -e 's/[[:space:]]//g' version.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compute tags (GHCR + optional JFrog)
        id: tags
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DATECODE=$(date -u +%Y%m%d-%H%M)
          SHA_SHORT=${GITHUB_SHA::7}

          IFS='.' read -r MAJOR MINOR PATCH <<EOF
          $VERSION
          EOF

          # GHCR tags
          TAGS="${{ env.IMAGE_GHCR }}:dev-${VERSION}-${DATECODE}-g${SHA_SHORT}"
          TAGS="$TAGS,${{ env.IMAGE_GHCR }}:dev-${VERSION}"
          TAGS="$TAGS,${{ env.IMAGE_GHCR }}:dev-${MAJOR}.${MINOR}-latest"
          TAGS="$TAGS,${{ env.IMAGE_GHCR }}:dev-latest"

          # Optional: also push same tags to JFrog docker repo
          if [ "${{ env.PUSH_TO_JFROG }}" = "true" ]; then
            TAGS="$TAGS,${{ env.IMAGE_JFROG }}:dev-${VERSION}-${DATECODE}-g${SHA_SHORT}"
            TAGS="$TAGS,${{ env.IMAGE_JFROG }}:dev-${VERSION}"
            TAGS="$TAGS,${{ env.IMAGE_JFROG }}:dev-${MAJOR}.${MINOR}-latest"
            TAGS="$TAGS,${{ env.IMAGE_JFROG }}:dev-latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build & Push (to all tags we computed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          pull: true
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Summary
        run: |
          echo "Pushed tags:"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
