---
name: Check Translations

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "Portal/src/Datahub.Portal/**"
  push:
    branches:
      - develop
      - main
    paths:
      - "Portal/src/Datahub.Portal/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-missing-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true

      - name: Install jq (for JSON processing)
        run: sudo apt-get install -y jq

      - name: Check for missing translations
        id: translation_check
        shell: bash
        run: |
          set -euo pipefail

          # Define the path to focus on (Portal/src/Datahub.Portal)
          target_path="Portal/src/Datahub.Portal"

          # Define all translation file names (without extensions)
          translation_files=("localization" "cbr" "databricks" "gchosting" "urls" "workspace_versions")

          # Load all English and French JSON files into associative arrays
          declare -A english_jsons
          declare -A french_jsons

          for file_base in "${translation_files[@]}"; do
            if [ -f "${target_path}/i18n/${file_base}.json" ]; then
              english_jsons[$file_base]=$(jq -r '.' "${target_path}/i18n/${file_base}.json")
            fi
            if [ -f "${target_path}/i18n/${file_base}.fr.json" ]; then
              french_jsons[$file_base]=$(jq -r '.' "${target_path}/i18n/${file_base}.fr.json")
            fi
          done

          # Create an array to hold file paths with matching Localizer patterns
          matching_files=()

          # Define the regex pattern to match @Localizer[""] or Localizer[""]
          pattern='@Localizer\["|Localizer\["'

          # Find all .cs and .razor files and search for the Localizer pattern
          while IFS= read -r file; do
            if grep -qP "$pattern" "$file"; then
              matching_files+=("$file")
            fi
          done < <(find "$target_path" -type f \( -name "*.cs" -o -name "*.razor" \))

          report_path="missing-translations-report.md"
          {
            echo "# Missing Translation Report"
            echo ""
            echo "Generated by workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## Missing keys"
          } > "$report_path"

          error_found=0
          missing_count=0

          # Iterate over the files with Localizer patterns
          for file in "${matching_files[@]}"; do
            relative_file="${file#"$target_path"/}"

            # Extract Localizer keys from the file (line-delimited)
            keys=$(grep -Po '(?<=Localizer\["|@Localizer\[").+?(?="\]|",)' "$file" | sort | uniq || true)

            # Process each key line by line
            while IFS= read -r key; do
              if [ -z "$key" ]; then
                continue
              fi

              # Check if the key exists in any English JSON file
              english_found=0
              for file_base in "${translation_files[@]}"; do
                if [ -n "${english_jsons[$file_base]:-}" ]; then
                  if echo "${english_jsons[$file_base]}" | jq -e --arg key "$key" '.[$key]' > /dev/null 2>&1; then
                    english_found=1
                    break
                  fi
                fi
              done

              if [ "$english_found" -eq 0 ]; then
                echo "Error: Missing English translation for key '$key' in file '$relative_file'"
                echo "- EN missing '$key' in '$relative_file'" >> "$report_path"
                error_found=1
                missing_count=$((missing_count + 1))
              fi

              # Check if the key exists in any French JSON file
              french_found=0
              for file_base in "${translation_files[@]}"; do
                if [ -n "${french_jsons[$file_base]:-}" ]; then
                  if echo "${french_jsons[$file_base]}" | jq -e --arg key "$key" '.[$key]' > /dev/null 2>&1; then
                    french_found=1
                    break
                  fi
                fi
              done

              if [ "$french_found" -eq 0 ]; then
                echo "Error: Missing French translation for key '$key' in file '$relative_file'"
                echo "- FR missing '$key' in '$relative_file'" >> "$report_path"
                error_found=1
                missing_count=$((missing_count + 1))
              fi
            done <<< "$keys"
          done

          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"

          # Record result for downstream artifact/comment steps.
          if [ "$error_found" -eq 1 ]; then
            echo "Missing translations detected!"
            echo "" >> "$report_path"
            echo "Total missing entries: $missing_count" >> "$report_path"
            echo "missing_found=true" >> "$GITHUB_OUTPUT"
            echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
          else
            echo "All translations found!"
            echo "- No missing translations found." >> "$report_path"
            echo "missing_found=false" >> "$GITHUB_OUTPUT"
            echo "missing_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload missing translation report
        if: steps.translation_check.outputs.missing_found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: missing-translations-report
          path: ${{ steps.translation_check.outputs.report_path }}

      - name: Comment translation check result on pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REPORT_PATH: ${{ steps.translation_check.outputs.report_path }}
          MISSING_COUNT: ${{ steps.translation_check.outputs.missing_count }}
          MISSING_FOUND: ${{ steps.translation_check.outputs.missing_found }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const marker = "<!-- translation-lint-report -->";
            const reportPath = process.env.REPORT_PATH;
            const missingCount = Number(process.env.MISSING_COUNT || 0);
            const missingFound = process.env.MISSING_FOUND === "true";
            const report = fs.readFileSync(reportPath, "utf8");

            const title = missingFound
              ? `## Missing translations detected (${missingCount})`
              : "## All translations are present";

            const body = `${marker}
            ${title}

            ${report}
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail workflow when translations are missing
        if: steps.translation_check.outputs.missing_found == 'true'
        run: |
          echo "Missing translations detected: ${STEPS_TRANSLATION_CHECK_OUTPUTS_MISSING_COUNT}"
          echo "See artifact: missing-translations-report"
          exit 1
        env:
          STEPS_TRANSLATION_CHECK_OUTPUTS_MISSING_COUNT: ${{ steps.translation_check.outputs.missing_count }}
