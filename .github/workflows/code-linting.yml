---
name: Lint

on:
  pull_request:
    branches:
      - develop

permissions: read-all

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write
      pull-requests: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter/slim@v8.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          SUPPRESS_POSSUM: true
          LINTER_RULES_PATH: /
          DISABLE_ERRORS: true
          SAVE_SUPER_LINTER_SUMMARY: true 

      - name: Read Summary File
        id: read_summary
        run: |
          SUMMARY_FILE="super-linter-output/super-linter-summary.md"
          
          if [ -f "$SUMMARY_FILE" ]; then
            # Read file content into a multiline output variable
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat "$SUMMARY_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=No summary generated." >> $GITHUB_OUTPUT
          fi

      - name: Find existing Super-linter Comment
        uses: actions-cool/issues-helper@v3
        id: find_comment
        with:
          actions: find-comments
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- super-linter-summary-identifier -->'
          show-thanks: "false"


      - name: Create Super-linter Comment
        if: steps.find_comment.outputs.comments == '[]'
        uses: actions-cool/issues-helper@v3
        with:
          actions: create-comment
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          show-thanks: "false"
          body: |
            <!-- super-linter-summary-identifier -->
            ${{ steps.read_summary.outputs.content }}


      - name: Update Super-linter Comment
        if: steps.find_comment.outputs.comments != '[]'
        uses: actions-cool/issues-helper@v3
        with:
          actions: update-comment
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ fromJSON(steps.find_comment.outputs.comments)[0].id }}
          update-mode: replace
          show-thanks: "false"
          body: |
            <!-- super-linter-summary-identifier -->
            ${{ steps.read_summary.outputs.content }}
